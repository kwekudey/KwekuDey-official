<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KwekuDey Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="wrap"><a class="back" href="index.html">← Public website</a><section id="login-card" class="panel"><p class="eyebrow">KWEKUDEY ADMIN</p><h1>Sign in</h1><p>Use the email and password you created in Supabase Authentication.</p><form id="login-form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="login-msg" class="msg"></p></section>
<section id="dashboard" hidden><div class="topbar"><div><p class="eyebrow">DASHBOARD</p><h1>Manage KwekuDey</h1></div><button id="logout" class="secondary">Log out</button></div>
<div id="status" class="status"></div>
<div class="panel"><h2>Profile & About</h2><div class="two"><label>Artist name<input id="artist"></label><label>Tagline<input id="tagline"></label></div><label>Bio<textarea id="bio" rows="5"></textarea></label><label>Booking email<input id="booking-email" type="email"></label><div class="upload"><label>Artist/profile image<input id="profile-file" type="file" accept="image/*"></label><button id="upload-profile" class="secondary">Upload image</button><span id="profile-url" class="muted"></span></div><button id="save-profile">Save profile</button></div>
<div class="panel"><div class="heading"><h2>Music</h2><button id="add-music" class="secondary">+ Add song</button></div><div id="music-list"></div><button id="save-music">Save music</button></div>
<div class="panel"><div class="heading"><h2>Videos</h2><button id="add-video" class="secondary">+ Add video</button></div><div id="video-list"></div><button id="save-videos">Save videos</button></div>
<div class="panel"><div class="heading"><h2>Shows</h2><button id="add-show" class="secondary">+ Add show</button></div><div id="show-list"></div><button id="save-shows">Save shows</button></div>
<div class="panel"><div class="heading"><h2>Social links</h2><button id="add-social" class="secondary">+ Add link</button></div><div id="social-list"></div><button id="save-socials">Save social links</button></div>
</section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
